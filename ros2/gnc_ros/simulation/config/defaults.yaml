simulation_node:
  ros__parameters:
    use_sim_time: true
    simulation:
      dt_s: 0.01  # 100 Hz wall timer.
      integration_method: rk4  # rk4, heun or euler.
    interceptor:
      mass_kg: 2.5
      rho_kgpm3: 1.225
      frontal_area_m2: 0.1
      drag_coeff: 0.08
      min_thrust_n: 0.0
      max_thrust_n: 150.0
      min_load_factor: -3.0
      max_load_factor: 9.0
      max_bank_angle_rad: 3.141592653589793
      min_speed_mps: 1.0
      max_speed_mps: 112.5
    sensor:
      range_var: 250.0
      range_rate_var: 8.0
      azimuth_var: 8.0e-6
      elevation_var: 8.0e-6
    target:
      # Only parameters used by the selected trajectory type are read.
      type: figure_eight
      # Constant velocity.
      position_m: [3000.0, 500.0, 1500.0]
      velocity_mps: [30.0, 0.0, 0.0]
      # Shared by figure eight, circle and helix.
      center_m: [3000.0, 500.0, 1500.0]
      normal: [1.0, 0.0, 1.0]
      reference_direction: [0.0, -1.0, 0.0]
      # Figure eight.
      length_m: 1000.0
      width_m: 500.0
      angular_rate_rps: 0.1
      # Circle and helix.
      speed_mps: 50.0
      load_factor: 1.0
      # Helix.
      climb_angle_rad: 0.1
